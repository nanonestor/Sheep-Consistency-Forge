minecraft_version=1.20.4
minecraft_version_range=[1.20.4,1.20.5)
neo_version=20.4.236
neo_version_range=[20.4,20.5)
loader_version_range=[2,)
mappings_channel=official
mappings_version=1.20.4

mod_id=sheepconsistencyforge
mod_name=Sheep Consistency Neoforge
mod_version=1.2
mod_license=MIT
mod_base_package=me.jsb.sheepconsistencyforge
mod_authors=Crupette, IMS21, SBOfficial, nanonestor
